<div data-sly-use.model="com.figma.aem.core.models.HumanaHeroModel" class="humana-hero"><div class="humana-hero__container"><div class="humana-hero__text"><p class="humana-hero__greeting" data-sly-test="${model.greeting}">${model.greeting}</p><h1 class="humana-hero__heading" data-sly-test="${model.heading}">${model.heading}</h1><div class="humana-hero__body" data-sly-test="${model.bodyText}">${model.bodyText @ context='html'}</div><div class="humana-hero__ctas"><a data-sly-test="${model.primaryCtaLink}" href="${model.primaryCtaLink @ extension='html'}" class="humana-hero__cta humana-hero__cta--primary"><span class="humana-hero__cta-text">${model.primaryCtaText @ context='text'}</span><span class="humana-hero__cta-icon humana-hero__cta-icon--play" aria-hidden="true"></span></a><a data-sly-test="${model.secondaryCtaLink}" href="${model.secondaryCtaLink @ extension='html'}" class="humana-hero__cta humana-hero__cta--secondary"><span class="humana-hero__cta-text">${model.secondaryCtaText @ context='text'}</span><span class="humana-hero__cta-icon humana-hero__cta-icon--arrow" aria-hidden="true"></span></a></div></div><div class="humana-hero__visual" data-sly-test="${model.deviceImage}"><img class="humana-hero__image" src="${model.deviceImage}" alt="${model.imageAlt @ context='text'}"/></div></div></div>
